<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
</head>
<body>
    <h1>Homepage</h1>
    <!-- Absolute links are those links that specify the complete URL, including the protocol (http or https) and the domain name. and are used to link to external websites. -->
    <a href="https://www.theodinproject.com/about" target="_blank" rel="noopener noreferrer">About The Odin Project</a> 
    <!-- <a> anchor tag is used to add any link in webpage, and href attribute is used to specify the link address 
        target="_blank" opens the link in a new tab
        rel="noopener noreferrer" is a security measure which prevents the new page from accessing the window.opener property saving us from phishing attacks rel shows the relation between both pages-->
    <!-- Relative links are those links that specify a path relative to the current page. They are used to link to other pages within the same website. -->
    <a href="about.html">About</a>

    <!-- <img> tags is a type of void element which doesn't require a closing tag, img has an attribute named src="source of image" which takes the source of image either from directory or the internet
    alt="alternative text if image doesn't show up" -->

    <img src="../images/sandisk-udRj4qXyAPs-unsplash.jpg" alt="A main coding" height="300" width="400">
    

</body>
</html>
