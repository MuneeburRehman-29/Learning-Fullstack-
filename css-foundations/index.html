<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css"> <!-- We use link element in head to link our css file with html, rel is required and specifies the relation to html file -->
    <style>
        /* Internal Css using style tag in head      */
        div{
            color: white;
            background-color: black;
        }
        p{
            color: red;
        }

    </style>
    <title>Css Foundations</title>
</head>
<body>


    
    <div id="title">Css Foundations</div>
    <div>Hello, World!</div>
    <div>Hello, again!</div>
    <div class="alert-text">WARNING</div>
    <p>This is Acromas</p>
    <!-- Chaining Selectors  -->

    <div>
        <div class="subsection header">Latest Posts</div>
        <p class="subsection preview">This is where a preview for a post might go.</p>
    </div>

    <div>
        <div class="subsection header">Latest Posts</div>
        <p class="subsection" id="preview">
        This is where a preview for a post might go.
        </p>
    </div>

    <!-- Decendent Combinator  -->
    <div class="ancestor">
        <div class="contents">
            <div class="contents"></div>
        </div>
    </div>
    <div class="contents"></div>

    <!-- Inline Css , it will override other two methods-->
     <div style="color: blueviolet;">Hey this is Inline css</div>



    
</body>
</html>
