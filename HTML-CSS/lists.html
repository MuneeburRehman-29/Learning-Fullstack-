<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Lists in HTML</h1>
    <!-- 
    -- Unordered List are used to display a list of items without a specific order 
    -- Ordered List are used to display a list of items in a specific order
    -->
    <h2>Unordered List</h2>
    <h3> Shopping list of my favourite food</h3>
    <ul> 
        <li> Biryani </li>
        <li> Karhaii </li>
        <li> Nihari </li>
        <li> Broast </li>
        <li> Zinger </li>
    </ul>
    <h2> Ordered List</h2>
    <h3> My Todo List</h3>
    <ol> 
        <li>Complete Module three of Ai automation with python</li>
        <li>Complete Html tutorial of Odin Project</li>
        <li> Watch a movie</li>
    </ol>
</body>
</html>
