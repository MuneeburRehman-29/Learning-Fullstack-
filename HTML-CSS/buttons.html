<style>
    .subscribe-button {
        background-color: rgb(200, 0, 0);
        color: white;
        border: none;
        border-radius: 2px;
        cursor: pointer;
        margin-right: 6px;
        transition: opacity 0.3s;
        padding: 8px 16px;
    }
    .subscribe-button:hover {
       opacity: 0.7;
    }
    .subscribe-button:active {
       opacity: 0.5;
    }
    .join-button {
        background-color: white;
        border-color: rgb(41, 118, 211);
        border-width: 1px;
        color: rgb(41, 118, 211);
        padding: 7px 15px;
        border-radius: 2px;
        cursor: pointer;
        margin-right: 6px;
        transition: background-color 0.3s, color 0.3s;
    }
    .join-button:hover {
       background-color: rgb(41, 118, 211);
       color: white;
    }
    .join-button:active {
       opacity: 0.7;
    }
    .tweet-button {
        background-color: rgb(29, 161, 242);
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 18px;
        cursor: pointer;
        font-weight: bold;
        font-size: 15px;
        transform: box-shadow 0.3s;
    }
    .tweet-button:hover {
       box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.2);
    }
</style>
 <!--height: 36px;
    width: 65px
    rather than doing height and width for button,
    we omit the height and width and let the content determine the size
    automatically and giving a padding for indernal structur of box or 
    button , Using box model-->
<!-- Default behaviour of browser to keep align things based on text -->
<button class="subscribe-button">
    SUBSCRIBE
</button>
<button class="join-button">
    JOIN
</button>

<button class="tweet-button">
    Tweet
</button>
